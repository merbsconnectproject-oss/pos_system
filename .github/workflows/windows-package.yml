name: Windows package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version
        required: true
        default: 0.1.0
      frontend_ref:
        description: pos-system branch, tag, or SHA
        required: true
        default: main
  push:
    branches:
      - feature/auth-session
    tags:
      - 'v*'

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: read

    # Two artifacts from one commit: the dedicated app window a till should have,
    # and the same application in the machine's ordinary browser. They install
    # over each other — same AppId, same services, same ports — so they are for
    # comparing on one counter at a time, not for running side by side.
    strategy:
      fail-fast: false
      matrix:
        launch: [AppWindow, Browser]

    steps:
      - name: Check out backend
        uses: actions/checkout@v7
        with:
          path: pos-api

      - name: Check out frontend
        uses: actions/checkout@v7
        with:
          repository: sowlbaby/pos-system
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.frontend_ref || (github.ref_name == 'feature/auth-session' && 'feature/auth-integration' || 'main') }}
          path: pos-system
          ssh-key: ${{ secrets.POS_SYSTEM_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: pos-api/pom.xml

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pos-system/package-lock.json

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Resolve version
        id: version
        shell: powershell
        run: |
          $version = '${{ inputs.version }}'
          if (-not $version) {
            if ('${{ github.ref_type }}' -eq 'tag') {
              $version = '${{ github.ref_name }}'.TrimStart('v')
            } else {
              $version = '0.1.0'
            }
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      # The Testcontainers suite runs in the Linux CI job. Windows packaging
      # still performs the complete frontend check and assembles the already
      # tested backend with its embedded web assets.
      - name: Frontend checks
        working-directory: pos-system
        run: npm ci; npm run check

      - name: Build offline installer (${{ matrix.launch }})
        working-directory: pos-api
        shell: powershell
        run: .\packaging\windows\build-installer.ps1 -Version '${{ steps.version.outputs.value }}' -LaunchMode '${{ matrix.launch }}' -SkipTests

      # Building an EXE proves only that Inno Setup accepted it. Install and
      # configure it on the clean Windows runner so service accounts, ACLs,
      # PostgreSQL startup and the Java health endpoint are release gates too.
      - name: Smoke-test installed counter (${{ matrix.launch }})
        shell: powershell
        run: |
          $response = Join-Path $env:RUNNER_TEMP 'radiance-onboarding.json'
          @{
            ownerUsername = 'ci-owner'
            ownerName = 'CI Owner'
            ownerEmail = 'ci@example.invalid'
            ownerPassword = 'Temporary-CI-Password-4827'
            ownerPasswordConfirm = 'Temporary-CI-Password-4827'
            ownerPin = '4827'
            ownerPinConfirm = '4827'
            outletCode = 'CI'
            outletName = 'Installer smoke test'
            terminalCode = '01'
            offsiteEnabled = $false
            offsiteEndpoint = ''
            offsiteBucket = ''
            offsiteAccessKey = ''
            offsiteSecretKey = ''
            offsiteRegion = 'auto'
            offsitePrefix = ''
          } | ConvertTo-Json | Set-Content -LiteralPath $response -Encoding UTF8

          $installer = Get-ChildItem 'pos-api\dist\Radiance-POS-Setup-*.exe' | Select-Object -First 1
          $install = Start-Process $installer.FullName -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/ONBOARDING=$response"
          ) -Wait -PassThru

          $healthy = $false
          if ($install.ExitCode -eq 0) {
            $deadline = (Get-Date).AddMinutes(3)
            do {
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:8080/actuator/health' -TimeoutSec 3
                if ($health.status -eq 'UP') { $healthy = $true; break }
              } catch { }
              Start-Sleep 2
            } while ((Get-Date) -lt $deadline)
          }

          if (-not $healthy) {
            Get-Service RadiancePosPostgreSQL, RadiancePos -ErrorAction SilentlyContinue |
              Format-List Name, Status, StartType
            $logs = Join-Path $env:ProgramData 'GiftedLabs\Radiance POS\logs'
            Get-ChildItem $logs -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime |
              ForEach-Object {
                Write-Host "`n===== $($_.FullName) ====="
                Get-Content $_.FullName -Tail 120 -ErrorAction SilentlyContinue
              }
            throw "Installed counter failed its health check (installer exit $($install.ExitCode))."
          }

          $postgres = Get-Service RadiancePosPostgreSQL
          $application = Get-Service RadiancePos
          if ($postgres.Status -ne 'Running' -or $application.Status -ne 'Running') {
            throw "Health was UP but one or more Windows services were not running."
          }
          Write-Host 'Installed counter is healthy and both services are running.'

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: radiance-pos-windows-${{ steps.version.outputs.value }}-${{ matrix.launch }}
          path: |
            pos-api/dist/Radiance-POS-Setup-*.exe
            pos-api/dist/Radiance-POS-Setup-*.sha256
          if-no-files-found: error
          retention-days: 30
