name: Windows package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version
        required: true
        default: 0.1.0
      frontend_ref:
        description: radiance-pos-frontend branch, tag, or SHA
        required: true
        default: main
  push:
    branches:
      - feature/auth-session
    tags:
      - 'v*'

jobs:
  paths:
    name: Windows administrator path checks
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Test native setup paths before packaging
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          # Read the pinned URL from the build script rather than maintaining
          # a second PostgreSQL version just for these checks.
          $script = (Resolve-Path 'packaging\windows\build-installer.ps1').Path
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$null, [ref]$null)
          $parameter = $ast.ParamBlock.Parameters | Where-Object { $_.Name.VariablePath.UserPath -eq 'PostgresUrl' }
          $url = $parameter.DefaultValue.SafeGetValue()
          $archive = Join-Path $env:RUNNER_TEMP 'postgresql.zip'
          Write-Host "Downloading PostgreSQL from $url"
          & curl.exe --fail --location --silent --show-error --retry 2 --connect-timeout 30 --max-time 180 --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw "PostgreSQL download failed (exit $LASTEXITCODE)." }
          $destination = Join-Path $env:RUNNER_TEMP 'postgresql-path-checks'
          Write-Host "Extracting $((Get-Item -LiteralPath $archive).Length) bytes"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($archive, $destination)
          $initdb = Get-ChildItem $destination -Filter initdb.exe -Recurse | Select-Object -First 1
          if (-not $initdb) { throw 'The PostgreSQL archive does not contain initdb.exe.' }
          Write-Host 'Running Windows native path regression checks'
          .\packaging\windows\tests\setup-paths.ps1 -PgBin $initdb.DirectoryName

  package:
    needs: paths
    runs-on: windows-latest
    permissions:
      contents: read

    # A hung installer used to sit until GitHub's six-hour job limit killed it,
    # which costs most of a day and teaches nothing. The build takes 26 minutes
    # and the smoke test a few, so anything past this is stuck, not slow.
    timeout-minutes: 50

    # Two artifacts from one commit: the dedicated app window a till should have,
    # and the same application in the machine's ordinary browser. They install
    # over each other — same AppId, same services, same ports — so they are for
    # comparing on one counter at a time, not for running side by side.
    strategy:
      fail-fast: false
      matrix:
        launch: [AppWindow, Browser]

    steps:
      - name: Check out backend
        uses: actions/checkout@v7
        with:
          path: pos-api

      - name: Check out frontend
        uses: actions/checkout@v7
        with:
          repository: Gifted-Labs/radiance-pos-frontend
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.frontend_ref || (github.ref_name == 'feature/auth-session' && 'feature/auth-integration' || 'main') }}
          path: pos-system
          ssh-key: ${{ secrets.POS_SYSTEM_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: pos-api/pom.xml

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pos-system/package-lock.json

      # build-installer.ps1 caches PostgreSQL and WinSW under target/, which is
      # rebuilt every run. Re-downloading 350MB per job is most of the gap
      # between a feedback loop you can iterate on and one you cannot.
      - name: Cache Windows build dependencies
        uses: actions/cache@v4
        with:
          path: pos-api/target/windows-dependencies
          key: windows-deps-postgresql-18.6-winsw-2.12.0

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Resolve version
        id: version
        shell: powershell
        run: |
          $version = '${{ inputs.version }}'
          if (-not $version) {
            if ('${{ github.ref_type }}' -eq 'tag') {
              $version = '${{ github.ref_name }}'.TrimStart('v')
            } else {
              $version = '0.1.0'
            }
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      # The Testcontainers suite runs in the Linux CI job. Windows packaging
      # still performs the complete frontend check and assembles the already
      # tested backend with its embedded web assets.
      - name: Frontend checks
        working-directory: pos-system
        run: npm ci; npm run check

      - name: Build offline installer (${{ matrix.launch }})
        working-directory: pos-api
        shell: powershell
        run: .\packaging\windows\build-installer.ps1 -Version '${{ steps.version.outputs.value }}' -LaunchMode '${{ matrix.launch }}' -SkipTests

      # Building an EXE proves only that Inno Setup accepted it. Install and
      # configure it on the clean Windows runner so service accounts, ACLs,
      # PostgreSQL startup and the Java health endpoint are release gates too.
      - name: Regression-test administrator temporary paths
        working-directory: pos-api
        shell: powershell
        run: .\packaging\windows\tests\setup-paths.ps1 -PgBin (Resolve-Path 'packaging\windows\stage\postgresql\bin').Path

      - name: Smoke-test installed counter (${{ matrix.launch }})
        shell: powershell
        run: |
          $profileTemp = Join-Path $env:RUNNER_TEMP 'Shop Admin [CI]\AppData\Local\Temp'
          New-Item -ItemType Directory -Path $profileTemp -Force | Out-Null
          $env:TEMP = $profileTemp
          $env:TMP = $profileTemp
          $response = Join-Path $profileTemp 'radiance onboarding.json'
          @{
            ownerUsername = 'ci-owner'
            ownerName = 'CI Owner'
            ownerEmail = 'ci@example.invalid'
            ownerPassword = 'Temporary-CI-Password-4827'
            ownerPasswordConfirm = 'Temporary-CI-Password-4827'
            ownerPin = '4827'
            ownerPinConfirm = '4827'
            outletCode = 'CI'
            outletName = 'Installer smoke test'
            terminalCode = '01'
            offsiteEnabled = $false
            offsiteEndpoint = ''
            offsiteBucket = ''
            offsiteAccessKey = ''
            offsiteSecretKey = ''
            offsiteRegion = 'auto'
            offsitePrefix = ''
          } | ConvertTo-Json | Set-Content -LiteralPath $response -Encoding UTF8

          $installer = Get-ChildItem 'pos-api\dist\Radiance-POS-Setup-*.exe' | Select-Object -First 1
          $install = Start-Process $installer.FullName -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/ONBOARDING="{0}"' -f $response)
          ) -PassThru

          # -Wait would block until the job timeout. A silent install that has
          # not finished in twelve minutes is stuck on something, and what it is
          # stuck on is the only thing worth knowing - so say where it got to,
          # name what is still running, and stop it.
          if (-not $install.WaitForExit(12 * 60 * 1000)) {
            Write-Host '::error::The silent install did not finish within 12 minutes.'
            $logs = Join-Path $env:ProgramData 'GiftedLabs\Radiance POS\logs'
            Get-ChildItem $logs -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime |
              ForEach-Object {
                Write-Host "`n===== $($_.FullName) ====="
                Get-Content $_.FullName -Tail 120 -ErrorAction SilentlyContinue
              }
            Write-Host "`n===== processes still running ====="
            Get-Process -Name 'powershell', 'icacls', 'takeown', 'secedit', 'initdb', 'postgres', 'pg_ctl', 'java', 'Radiance*' -ErrorAction SilentlyContinue |
              Format-Table Id, ProcessName, StartTime, Path -AutoSize | Out-String -Width 400 | Write-Host
            Write-Host "`n===== last command line of each powershell ====="
            Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" |
              ForEach-Object { Write-Host $_.CommandLine }
            Get-Process -Name 'Radiance*', 'powershell' -ErrorAction SilentlyContinue |
              Where-Object { $_.Id -ne $PID } | Stop-Process -Force -ErrorAction SilentlyContinue
            throw 'Silent install hung.'
          }

          $healthy = $false
          if ($install.ExitCode -eq 0) {
            $deadline = (Get-Date).AddMinutes(3)
            do {
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:8080/actuator/health' -TimeoutSec 3
                if ($health.status -eq 'UP') { $healthy = $true; break }
              } catch { }
              Start-Sleep 2
            } while ((Get-Date) -lt $deadline)
          }

          if (-not $healthy) {
            Get-Service RadiancePosPostgreSQL, RadiancePos -ErrorAction SilentlyContinue |
              Format-List Name, Status, StartType
            $logs = Join-Path $env:ProgramData 'GiftedLabs\Radiance POS\logs'
            Get-ChildItem $logs -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime |
              ForEach-Object {
                Write-Host "`n===== $($_.FullName) ====="
                Get-Content $_.FullName -Tail 120 -ErrorAction SilentlyContinue
              }
            throw "Installed counter failed its health check (installer exit $($install.ExitCode))."
          }

          $postgres = Get-Service RadiancePosPostgreSQL
          $application = Get-Service RadiancePos
          if ($postgres.Status -ne 'Running' -or $application.Status -ne 'Running') {
            throw "Health was UP but one or more Windows services were not running."
          }
          Write-Host 'Installed counter is healthy and both services are running.'

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: radiance-pos-windows-${{ steps.version.outputs.value }}-${{ matrix.launch }}
          path: |
            pos-api/dist/Radiance-POS-Setup-*.exe
            pos-api/dist/Radiance-POS-Setup-*.sha256
          if-no-files-found: error
          retention-days: 30
